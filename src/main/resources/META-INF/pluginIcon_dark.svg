<svg
    width="40"
    height="40"
    viewBox="0 0 40 40"
    xmlns="http://www.w3.org/2000/svg"
>
    <!-- バンドの付け根（上下） -->
    <rect x="15" y="0" width="10" height="5" fill="#9CA3AF" />
    <rect x="15" y="35" width="10" height="5" fill="#9CA3AF" />

    <!-- 左ボタン -->
    <rect x="3.75" y="15" width="2.5" height="10" fill="#9CA3AF" />

    <!-- 右ボタン3つ -->
    <rect x="33.75" y="7.5" width="2.5" height="5" fill="#9CA3AF" />
    <rect x="33.75" y="17.5" width="2.5" height="5" fill="#9CA3AF" />
    <rect x="33.75" y="27.5" width="2.5" height="5" fill="#9CA3AF" />

    <!-- メインボディ -->
    <rect x="5" y="5" width="30" height="30" rx="2.5" fill="#9CA3AF" />

    <!-- スクリーン（薄いグレー） -->
    <rect x="10" y="10" width="20" height="20" rx="1.25" fill="#E2E8F0" />
</svg>