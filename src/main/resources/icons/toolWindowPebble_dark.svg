<svg
    viewBox="0 0 16 16"
    xmlns="http://www.w3.org/2000/svg"
>
    <!-- バンドの付け根（上下） -->
    <rect x="6" y="0" width="4" height="2" fill="white" />
    <rect x="6" y="14" width="4" height="2" fill="white" />

    <!-- 左ボタン -->
    <rect x="1.5" y="6" width="1" height="4" fill="white" />

    <!-- 右ボタン3つ -->
    <rect x="13.5" y="3" width="1" height="2" fill="white" />
    <rect x="13.5" y="7" width="1" height="2" fill="white" />
    <rect x="13.5" y="11" width="1" height="2" fill="white" />

    <!-- メインボディ -->
    <rect x="2" y="2" width="12" height="12" rx="1" fill="white" />

    <!-- スクリーン（薄いグレー） -->
    <rect x="4" y="4" width="8" height="8" rx="0.5" fill="#94A3B8" />
</svg>